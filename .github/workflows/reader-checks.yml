name: Reader checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/postgres-flashcards

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lean backend test dependencies
        run: python -m pip install "SQLAlchemy>=2.0,<3.0" "psycopg[binary]>=3.1,<4.0" "python-dotenv>=1.0,<2.0" "alembic>=1.13,<2.0"
      - name: Check Python syntax
        run: python -m compileall -q backend scripts tests
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JS syntax
        run: |
          find ui services utils -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check app.js
      - name: Run frontend and DOM contract tests
        run: node --test tests/*.mjs
